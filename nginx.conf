server {
    listen 80;
    server_name example.com;  # Replace with your domain

    root /var/www/regex-study/dist;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets aggressively (Vite adds content hashes to filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache public files for a short time
    location ~* \.(json|md|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # API proxy to backend Express server
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: all non-/api routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: redirect HTTP to HTTPS (uncomment after setting up SSL)
    # return 301 https://$host$request_uri;
}

